name: verify

# The guide checks itself on every push — the same contract it teaches:
#   1. the demo gate proves it still catches defects (minigate --selftest)
#   2. every relative link across all markdown resolves (tools/check_links.py)
# A red run blocks the merge, exactly like the serials this guide describes.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - name: Gate selftest (a gate must prove it catches defects)
        run: python3 examples/minigate.py --selftest
      - name: Link sweep (every relative link in the guide resolves)
        run: python3 tools/check_links.py
      - name: Manifest (every file hash-matches MANIFEST.sha256)
        run: python3 tools/check_manifest.py
