name: gate
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
jobs:
  selftest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Gate selftest (a gate must prove it catches defects)
        run: python3 examples/minigate.py --selftest
